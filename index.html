<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ignore Vite HMR WebSocket connection errors per environment constraints (HMR disabled in AI Studio)
      (function() {
        const suppress = (msg) => typeof msg === 'string' && (msg.includes('[vite]') || msg.toLowerCase().includes('websocket'));
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(suppress)) return;
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(suppress)) return;
          origWarn.apply(console, args);
        };
      })();
    </script>
