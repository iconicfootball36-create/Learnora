<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="learnoraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Inner Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Symbol Linear Gradients -->
    <linearGradient id="bookLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="bookRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Dropshadows -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.6" />
    </filter>
    <filter id="glowSpark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#fef08a" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#learnoraBg)" />
  <rect width="512" height="512" rx="116" fill="url(#auraGlow)" />

  <!-- Subtle Beveled Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="3" />

  <!-- Central Knowledge Core: Open Wisdom Book + Neural Brain Synapses + Radiant Spark -->
  <g filter="url(#iconShadow)">
    <!-- Open Book Base Platform -->
    <!-- Left Page Wing -->
    <path d="M256 348 C205 328 145 326 96 342 C92 343 88 340 88 335 V200 C88 196 92 193 96 191 C145 175 205 177 256 198 Z" 
          fill="url(#bookLeftGrad)" />
    <!-- Right Page Wing -->
    <path d="M256 348 C307 328 367 326 416 342 C420 343 424 340 424 335 V200 C424 196 420 193 416 191 C367 175 307 177 256 198 Z" 
          fill="url(#bookRightGrad)" />

    <!-- Center Book Spine Groove -->
    <path d="M256 196 V352" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />

    <!-- Neural Intellect Pathways Emanating from the Center -->
    <path d="M256 196 C240 148 200 115 152 110" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 0" />
    <path d="M256 196 C272 148 312 115 360 110" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" />
    
    <path d="M208 152 C175 160 140 178 120 205" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85" />
    <path d="M304 152 C337 160 372 178 392 205" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85" />

    <!-- Synapse Nodes / Stars of Knowledge -->
    <circle cx="152" cy="110" r="14" fill="#38bdf8" />
    <circle cx="152" cy="110" r="8" fill="#ffffff" />

    <circle cx="360" cy="110" r="14" fill="#38bdf8" />
    <circle cx="360" cy="110" r="8" fill="#ffffff" />

    <circle cx="120" cy="205" r="10" fill="#a5b4fc" />
    <circle cx="392" cy="205" r="10" fill="#a5b4fc" />

    <circle cx="256" cy="350" r="12" fill="#c7d2fe" />

    <!-- Central Radiant Spark of Inspiration & AI Genius -->
    <g transform="translate(256, 126)" filter="url(#glowSpark)">
      <!-- 8-Pointed Star of Intellect -->
      <path d="M0 -42 Q4 -12 28 -28 Q12 -4 42 0 Q12 4 28 28 Q4 12 0 42 Q-4 12 -28 28 Q-12 4 -42 0 Q-12 -4 -28 -28 Q-4 -12 0 -42 Z" 
            fill="url(#sparkGrad)" />
      <circle cx="0" cy="0" r="9" fill="#ffffff" />
    </g>

    <!-- Bottom Stylized "L" Anchor Indicator -->
    <path d="M210 398 H292 C298 398 302 402 302 408 C302 414 298 418 292 418 H220 V380 C220 374 216 370 210 370 C204 370 200 374 200 380 V408 C200 414 204 418 210 418 Z" 
          fill="#818cf8" opacity="0.45" />
  </g>
</svg>
